<body>
<div class="wrap">
  <h1>天气联动 · 七种状态对照</h1>
  <p class="lede">
    狗是<b>应用里同一套绘制代码</b>（params / pose / shiba 三个模块原样引进来），不是另画的示意图。
    每张卡下面写了它靠天气接口里哪个字段触发、多久播一次、它会说什么。想看差别就点右上角「对照」，或者用下面的「全部对照」。
  </p>
  <div class="bar">
    <button id="playBtn" data-slot="button" type="button">暂停</button>
    <button id="allCmp" data-slot="button" type="button">全部对照</button>
    <label>体型 <select id="stageSel"><option value="adult">成犬</option><option value="puppy">幼犬</option></select></label>
    <span class="clock">已播放 <b id="clock">0.0 秒</b></span>
  </div>
  <div id="grid"></div>
  <footer>
    这一页只是给你判断"哪些要、哪些不要"的样品，不会进应用。定了之后我再把它接进狗窗的动画层：
    天气数据每 30 分钟取一次并缓存，取不到就用上次缓存，缓存超过 3 小时则整套表现停掉（宁可没有，不拿旧数据演）。
  </footer>
