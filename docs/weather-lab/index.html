<!doctype html>
<html lang="zh-CN" class="dark sg-tint-mauve sg-thick-default sg-rim-default sg-shadow-default sg-accent-violet">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>天气联动 · 效果对照</title>
<link rel="stylesheet" href="../../src/renderer/glass/solid-glass.css" />
<link rel="stylesheet" href="../../src/renderer/glass/tint-presets.css" />
<link rel="stylesheet" href="../../src/renderer/glass/theme-shim.css" />
<style>
  body {
    margin: 0; padding: 26px 26px 60px;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--foreground); background-color: var(--background);
    background-image:
      radial-gradient(52rem 30rem at 12% -6%, var(--light-1), transparent 70%),
      radial-gradient(46rem 30rem at 92% 8%, var(--light-2), transparent 72%),
      radial-gradient(60rem 34rem at 60% 108%, var(--light-3), transparent 70%);
    background-attachment: fixed;
  }
  .wrap { max-width: 1320px; margin: 0 auto; }
  h1 { font-size: 21px; margin: 0 0 6px; }
  .lede { font-size: 13.5px; line-height: 1.7; color: var(--muted-foreground); margin: 0 0 16px; }
  .lede b { color: var(--foreground); }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 18px; font-size: 13px; }
  .bar [data-slot="button"], .bar select {
    font: inherit; font-size: 12.5px; padding: 7px 11px; cursor: pointer;
    border: 1px solid var(--border); color: var(--foreground);
    background: var(--secondary); border-radius: var(--radius-control);
  }
  .bar .clock { font-size: 12px; color: var(--muted-foreground); margin-left: auto; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  section.wf-card { padding: 12px 13px 13px; }
  .wf-head { display: flex; align-items: center; gap: 8px; margin: 0 0 9px; }
  .wf-head h3 { font-size: 13.5px; margin: 0; font-weight: 600; }
  .wf-cmp { margin-left: auto; font: inherit !important; font-size: 11.5px !important; padding: 4px 8px !important; }
  .wf-cmp.on { background: var(--primary) !important; color: var(--primary-foreground) !important; border-color: transparent !important; }
  canvas { display: block; width: 100%; height: auto; border-radius: var(--radius-control); border: 1px solid var(--border); background: #22283a; }
  dl.wf-meta { margin: 10px 0 0; font-size: 11.5px; line-height: 1.55; }
  .wf-meta dt { color: var(--muted-foreground); font-weight: 600; margin-top: 6px; }
  .wf-meta dd { margin: 1px 0 0; }
  footer { margin-top: 20px; font-size: 12px; line-height: 1.7; color: var(--muted-foreground); }
</style>
</head>
<body>
<div class="wrap">
  <h1>天气联动 · 七种状态对照</h1>
  <p class="lede">
    狗是<b>应用里同一套绘制代码</b>（params / pose / shiba 三个模块原样引进来），不是另画的示意图。
    每张卡下面写了它靠天气接口里哪个字段触发、多久播一次、它会说什么。想看差别就点右上角「对照」，或者用下面的「全部对照」。
  </p>
  <div class="bar">
    <button id="playBtn" data-slot="button" type="button">暂停</button>
    <button id="allCmp" data-slot="button" type="button">全部对照</button>
    <label>体型 <select id="stageSel"><option value="adult">成犬</option><option value="puppy">幼犬</option></select></label>
    <span class="clock">已播放 <b id="clock">0.0 秒</b></span>
  </div>
  <div id="grid"></div>
  <footer>
    这一页只是给你判断"哪些要、哪些不要"的样品，不会进应用。定了之后我再把它接进狗窗的动画层：
    天气数据每 30 分钟取一次并缓存，取不到就用上次缓存，缓存超过 3 小时则整套表现停掉（宁可没有，不拿旧数据演）。
  </footer>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
