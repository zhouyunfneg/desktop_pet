<!doctype html>
<!--
  Solid Glass 的旋钮（见 skills/solid-glass/references/knobs.md）：
  浅色 + warm 奶油底 + amber 蜂蜜强调 + 大圆角 = 和柴犬的毛色同一套暖调；
  rim 用 soft（弱一点的顶部高光），厚度和投影留默认，菜单是瞬时面板不需要 sg-shadow-deep。
  深浅只由 html 上的 .dark 决定，本项目不开深色，改色都在 styles.css 的调色区统一调。
-->
<html lang="zh-CN" class="sg-tint-warm sg-rim-soft sg-accent-amber sg-radius-large">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌面宠物</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- 狗窗与设置窗共用这一份产物，靠 body 上的 view-settings 类决定显示哪一块 -->
    <canvas id="stage"></canvas>
    <div id="settings-root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
